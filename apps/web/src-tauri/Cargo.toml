[package]
name = "tars-companion"
version = "1.0.0"
description = "TARS Quantitative Trading Companion Desktop Shell"
authors = ["TARS Team"]
license = "MIT"
edition = "2021"

[lib]
name = "tars_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
# Native microphone capture + VAD transport. Wake recognition and all
# assistant business logic remain in the backend TurnController.
cpal = "0.18"
ureq = { version = "2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
] }
winreg = "0.52"
# WinRT Windows.Graphics.Capture bindings for the non-intrusive background
# chart watcher (capture_wgc.rs) -- distinct from windows-sys above, which
# only covers raw Win32 (used by the existing hide/BitBlt capture path).
# Already present transitively via tauri's own dependency tree; pinned here
# as a direct dependency with the specific feature set this crate needs.
windows = { version = "0.61", features = [
    "Foundation",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
] }

