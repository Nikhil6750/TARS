[package]
name = "tars-companion"
version = "1.0.0"
description = "TARS Quantitative Trading Companion Desktop Shell"
authors = ["TARS Team"]
license = "MIT"
edition = "2021"

[lib]
name = "tars_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.0.0"
tauri-plugin-global-shortcut = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
