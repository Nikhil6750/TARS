[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    "B008",   # FastAPI's Depends()-as-default is the standard DI pattern.
    "UP042",  # str+Enum (not StrEnum) so members serialize/compare as plain strings for contract dicts.
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = ["tests/"]
